<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D&D 5e Character Sheet</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f0f0f; }
    #root { min-height: 100vh; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f0f0f; gap: 16px; z-index: 9999; }
    #loading h1 { font-size: 22px; color: #a78bfa; font-weight: 700; font-family: sans-serif; }
    #loading p { font-size: 13px; color: #666; font-family: sans-serif; }
    .spinner { width: 40px; height: 40px; border: 3px solid #1e1e2e; border-top-color: #a78bfa; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <h1>&#9876;&#65039; D&amp;D 5e Character Sheet</h1>
    <p>Loading...</p>
  </div>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.2/babel.min.js"></script>
  <script>
    window.useState    = React.useState;
    window.useCallback = React.useCallback;
    window.useRef      = React.useRef;
    window.useEffect   = React.useEffect;
    window.useMemo     = React.useMemo;

    function showError(msg) {
      var el = document.getElementById('loading');
      el.style.display = 'flex';
      el.innerHTML =
        '<div style="max-width:90vw;padding:20px;font-family:monospace">' +
        '<h2 style="color:#f87171;margin-bottom:10px">Error</h2>' +
        '<pre style="background:#1e1e2e;color:#e0e0e0;padding:10px;border-radius:6px;' +
        'font-size:11px;white-space:pre-wrap;word-break:break-all;max-height:60vh;overflow:auto">' +
        String(msg).replace(/</g,'&lt;') + '</pre></div>';
    }

    function loadSheet(filename) {
      document.querySelector('#loading p').textContent = 'Loading ' + filename + '...';
      fetch(filename)
        .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
        .then(function(src) {
          try {
            var result = Babel.transform(src, { presets: ['react'], sourceType: 'unambiguous' });
            new Function('React','ReactDOM','window', result.code)(React, ReactDOM, window);
            document.getElementById('loading').style.display = 'none';
          } catch(e) {
            showError(e.message + '\n\n' + (e.stack||''));
          }
        })
        .catch(function(e) { showError(e.stack || e.message || String(e)); });
    }

    // Try GitHub API to find the versioned file, fall back to fixed name
    fetch('https://api.github.com/repos/kduranfl-520/DND-Sheet/contents/')
      .then(function(r) { return r.json(); })
      .then(function(files) {
        // Find file matching pattern: (v\d+-)?dnd-sheet-all-in-one.jsx
        var match = files.filter(function(f) {
          return /dnd-sheet-all-in-one\.jsx$/i.test(f.name);
        }).sort(function(a, b) {
          // Sort by version number descending, pick highest
          var va = parseInt((a.name.match(/v(\d+)/) || [0,0])[1]);
          var vb = parseInt((b.name.match(/v(\d+)/) || [0,0])[1]);
          return vb - va;
        })[0];
        if (match) {
          loadSheet(match.name);
        } else {
          // Fallback to unversioned name
          loadSheet('dnd-sheet-all-in-one.jsx');
        }
      })
      .catch(function() {
        // API unavailable (offline, rate limit, private repo) — fall back to fixed name
        loadSheet('dnd-sheet-all-in-one.jsx');
      });
  </script>
</body>
</html>
