<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D&D 5e Character Sheet</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f0f0f; color: #e5e5e5; font-family: system-ui, sans-serif; }
    #root { min-height: 100vh; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: #0f0f0f;
      gap: 16px; z-index: 9999;
    }
    #loading h1 { font-size: 24px; color: #a78bfa; font-weight: 700; letter-spacing: .05em; }
    #loading p { font-size: 13px; color: #666; }
    .spinner {
      width: 40px; height: 40px; border: 3px solid #1e1e2e;
      border-top-color: #a78bfa; border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #error {
      display: none; position: fixed; inset: 0; align-items: center;
      justify-content: center; background: #0f0f0f; flex-direction: column; gap: 12px;
    }
    #error h2 { color: #f87171; font-size: 20px; }
    #error p { color: #888; font-size: 13px; max-width: 400px; text-align: center; line-height: 1.6; }
    #error code { background: #1e1e1e; padding: 2px 6px; border-radius: 4px; font-size: 12px; color: #a78bfa; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <h1>⚔️ D&D 5e Character Sheet</h1>
    <p>Loading library data...</p>
  </div>

  <div id="error">
    <h2>⚠️ Failed to Load</h2>
    <p>Make sure all three files are in the same folder:<br/>
      <code>index.html</code>, <code>dnd-library.js</code>, <code>dnd-sheet-production.jsx</code>
    </p>
    <p>Open via a local server (e.g. VS Code Live Server) or GitHub Pages — not by double-clicking the file.</p>
  </div>

  <div id="root"></div>

  <!-- Step 1: Load the library data first -->
  <script src="dnd-library.js" onerror="showError('dnd-library.js')"></script>

  <!-- Step 2: React + Babel from CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Step 3: Load the sheet -->
  <script type="text/babel" src="dnd-sheet-production.jsx" data-type="module" onerror="showError('dnd-sheet-production.jsx')"></script>

  <script>
    function showError(file) {
      document.getElementById('loading').style.display = 'none';
      const err = document.getElementById('error');
      err.style.display = 'flex';
      err.querySelector('h2').textContent = '⚠️ Could not load ' + file;
    }

    // Hide loading spinner once React mounts
    const observer = new MutationObserver(() => {
      if (document.getElementById('root').children.length > 0) {
        document.getElementById('loading').style.display = 'none';
        observer.disconnect();
      }
    });
    observer.observe(document.getElementById('root'), { childList: true });

    // Fallback timeout
    setTimeout(() => {
      if (document.getElementById('loading').style.display !== 'none') {
        showError('the sheet (timeout)');
      }
    }, 15000);
  </script>
</body>
</html>
