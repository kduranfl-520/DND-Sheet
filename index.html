<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D&D 5e Character Sheet</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f0f0f; }
    #root { min-height: 100vh; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f0f0f; gap: 16px; z-index: 9999; }
    #loading h1 { font-size: 22px; color: #a78bfa; font-weight: 700; font-family: sans-serif; }
    #loading p { font-size: 13px; color: #666; font-family: sans-serif; }
    .spinner { width: 40px; height: 40px; border: 3px solid #1e1e2e; border-top-color: #a78bfa; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <h1>⚔️ D&D 5e Character Sheet</h1>
    <p id="loading-msg">Loading...</p>
  </div>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.2/babel.min.js"></script>

  <script>
    window.useState    = React.useState;
    window.useCallback = React.useCallback;
    window.useRef      = React.useRef;
    window.useEffect   = React.useEffect;
    window.useMemo     = React.useMemo;

    var CACHE_KEY = 'dnd_compiled_v2';

    function setMsg(t) {
      var el = document.getElementById('loading-msg');
      if (el) el.textContent = t;
    }

    function showError(msg) {
      var el = document.getElementById('loading');
      el.innerHTML =
        '<div style="max-width:90vw;padding:24px;font-family:sans-serif;text-align:center">' +
        '<div style="font-size:40px;margin-bottom:16px">⚠️</div>' +
        '<h2 style="color:#f87171;margin-bottom:12px;font-size:18px">Failed to load</h2>' +
        '<pre style="background:#1e1e2e;color:#e0e0e0;padding:12px;border-radius:8px;' +
        'font-size:11px;white-space:pre-wrap;word-break:break-all;text-align:left;' +
        'max-height:50vh;overflow:auto">' + String(msg).replace(/</g,'&lt;') + '</pre></div>';
    }

    function runCode(code) {
      var tag = document.createElement('script');
      tag.textContent = code;
      document.body.appendChild(tag);
      document.getElementById('loading').style.display = 'none';
    }

    // Try to use cached compiled code first
    function tryCache(src, srcLen) {
      try {
        var cached = sessionStorage.getItem(CACHE_KEY);
        if (cached) {
          var obj = JSON.parse(cached);
          if (obj.len === srcLen) {
            setMsg('Restoring...');
            runCode(obj.code);
            return true;
          }
        }
      } catch(e) {}
      return false;
    }

    function saveCache(code, srcLen) {
      try {
        sessionStorage.setItem(CACHE_KEY, JSON.stringify({ len: srcLen, code: code }));
      } catch(e) {
        // sessionStorage full — clear and try once
        try { sessionStorage.clear(); sessionStorage.setItem(CACHE_KEY, JSON.stringify({ len: srcLen, code: code })); } catch(e2) {}
      }
    }

    setMsg('Loading sheet...');
    fetch('dnd-sheet-all-in-one.jsx')
      .then(function(r) {
        if (!r.ok) throw new Error('Could not load sheet (HTTP ' + r.status + ')');
        return r.text();
      })
      .then(function(src) {
        var srcLen = src.length;
        // Check cache before compiling
        if (tryCache(src, srcLen)) return;
        // Cache miss — compile
        setMsg('Compiling (first load only)...');
        var result;
        try {
          result = Babel.transform(src, { presets: ['react'], sourceType: 'script' });
        } catch(e) {
          throw new Error('Babel error:\n' + e.message);
        }
        saveCache(result.code, srcLen);
        setMsg('Starting...');
        runCode(result.code);
      })
      .catch(function(e) {
        showError(e.stack || e.message || String(e));
      });

    window.addEventListener('error', function(e) {
      showError((e.error && e.error.stack) || e.message);
    });
    window.addEventListener('unhandledrejection', function(e) {
      showError(e.reason && e.reason.stack ? e.reason.stack : String(e.reason));
    });
  </script>
</body>
</html>
