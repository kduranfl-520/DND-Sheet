<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D&D 5e Character Sheet</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f0f0f; }
    #root { min-height: 100vh; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f0f0f; gap: 16px; }
    #loading h1 { font-size: 22px; color: #a78bfa; font-weight: 700; font-family: sans-serif; }
    #loading p { font-size: 13px; color: #666; font-family: sans-serif; }
    .spinner { width: 40px; height: 40px; border: 3px solid #1e1e2e; border-top-color: #a78bfa; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <h1>⚔️ D&D 5e Character Sheet</h1>
    <p>Loading...</p>
  </div>
  <div id="root"></div>

  <!-- React + ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel standalone for JSX transformation -->
  <script src="https://unpkg.com/@babel/standalone@7.23.2/babel.min.js"></script>

  <!-- Library data -->
  <script src="dnd-library.js"></script>

  <!-- Sheet: loaded as text, transformed, then executed -->
  <script>
    // Make hooks available globally before sheet runs
    window.useState = React.useState;
    window.useCallback = React.useCallback;
    window.useRef = React.useRef;
    window.useEffect = React.useEffect;
    window.useMemo = React.useMemo;

    fetch('dnd-sheet-production.jsx')
      .then(r => { if (!r.ok) throw new Error('Failed to load sheet: HTTP ' + r.status); return r.text(); })
      .then(src => {
        // Transform JSX to JS
        const result = Babel.transform(src, {
          presets: ['react'],
          sourceType: 'unambiguous'  // not module — avoids import() issues
        });
        // Execute
        const fn = new Function(result.code);
        fn();
        document.getElementById('loading').style.display = 'none';
      })
      .catch(e => {
        document.getElementById('loading').innerHTML =
          '<h1 style="color:#f87171;font-family:sans-serif">⚠️ ' + e.message + '</h1>';
        console.error(e);
      });
  </script>
</body>
</html>
