<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D&D 5e Character Sheet</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f0f0f; }
    #root { min-height: 100vh; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f0f0f; gap: 16px; }
    #loading h1 { font-size: 22px; color: #a78bfa; font-weight: 700; font-family: sans-serif; }
    #loading p { font-size: 13px; color: #666; font-family: sans-serif; }
    .spinner { width: 40px; height: 40px; border: 3px solid #1e1e2e; border-top-color: #a78bfa; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <h1>⚔️ D&D 5e Character Sheet</h1>
    <p>Loading...</p>
  </div>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.2/babel.min.js"></script>
  <script>
    function showError(title, msg) {
      var el = document.getElementById('loading');
      el.style.display = 'flex';
      el.innerHTML = '<div style="max-width:90vw;padding:20px;font-family:monospace">' +
        '<h2 style="color:#f87171;margin-bottom:12px">⚠️ ' + title + '</h2>' +
        '<pre style="background:#1e1e2e;color:#e0e0e0;padding:12px;border-radius:8px;font-size:12px;white-space:pre-wrap;word-break:break-all;max-height:60vh;overflow:auto">' +
        String(msg).replace(/</g,'&lt;') + '</pre>' +
        '<p style="color:#888;margin-top:12px;font-size:12px">Share this error to get help fixing it.</p></div>';
    }

    window.useState = React.useState;
    window.useCallback = React.useCallback;
    window.useRef = React.useRef;
    window.useEffect = React.useEffect;
    window.useMemo = React.useMemo;

    fetch('dnd-sheet-all-in-one.jsx')
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status + ' loading JSX file'); return r.text(); })
      .then(src => {
        var result;
        try {
          result = Babel.transform(src, { presets: ['react'], sourceType: 'unambiguous' });
        } catch(e) {
          throw new Error('Babel transform failed:\n' + e.message);
        }
        try {
          new Function('React', 'ReactDOM', 'window', result.code)(React, ReactDOM, window);
        } catch(e) {
          throw new Error('JS execution failed:\n' + (e.stack || e.message));
        }
        document.getElementById('loading').style.display = 'none';
      })
      .catch(e => {
        showError('Load Error', e.message || String(e));
        console.error(e);
      });

    // Catch any errors that slip through after load
    window.addEventListener('error', function(e) {
      showError('Runtime Error (line ' + e.lineno + ')', (e.error && e.error.stack) || e.message);
    });
    window.addEventListener('unhandledrejection', function(e) {
      showError('Unhandled Error', e.reason && e.reason.stack ? e.reason.stack : String(e.reason));
    });
  </script>
</body>
</html>
